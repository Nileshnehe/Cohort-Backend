services:
  backend:
    build: ./Backend
    ports:
      - "8080:3000"
    volumes:
      - ./Backend:/app # Bind Mount: Syncs code for development
      - Backend_node_modules:/app/node_modules # Named Volume: Protects dependencies
    command: npx nodemon -L server.js

  frontend:
    build: ./Frontend
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - Frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  # Declaring the named volume
  Backend_node_modules:
  Frontend_node_modules:
